# Image name is a placeholder -- build and either push to a registry or,
# for local testing with kind, load it directly:
#   docker build -t nl2sql-agentic-rag-api:latest .
#   kind load docker-image nl2sql-agentic-rag-api:latest
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nl2sql-api
  namespace: nl2sql-agentic-rag
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nl2sql-api
  template:
    metadata:
      labels:
        app: nl2sql-api
    spec:
      containers:
        - name: api
          image: nl2sql-agentic-rag-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: nl2sql-config
            - secretRef:
                name: nl2sql-secrets
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            # 512Mi OOM-killed (exit 137) on the first real query: Chroma plus
            # the ONNX embedder plus a query in flight exceeds it. The embedder
            # is sized for a ~1GB container, so the limit has to match.
            limits:
              cpu: 500m
              memory: 1Gi
          # Liveness must not run until startup succeeds, or a slow cold start
          # (large image, several pods unpacking at once) gets killed as a hang.
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 5
            failureThreshold: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: nl2sql-api
  namespace: nl2sql-agentic-rag
spec:
  selector:
    app: nl2sql-api
  ports:
    - port: 8000
      targetPort: 8000
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: nl2sql-api-hpa
  namespace: nl2sql-agentic-rag
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: nl2sql-api
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
