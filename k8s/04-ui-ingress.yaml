apiVersion: apps/v1
kind: Deployment
metadata:
  name: nl2sql-ui
  namespace: nl2sql-agentic-rag
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nl2sql-ui
  template:
    metadata:
      labels:
        app: nl2sql-ui
    spec:
      containers:
        - name: ui
          image: nl2sql-agentic-rag-api:latest # same image; UI just runs a different command
          imagePullPolicy: IfNotPresent
          command: ["streamlit", "run", "ui/app.py", "--server.port=8501", "--server.address=0.0.0.0"]
          ports:
            - containerPort: 8501
          env:
            - name: API_URL
              value: "http://nl2sql-api:8000"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 300m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: nl2sql-ui
  namespace: nl2sql-agentic-rag
spec:
  selector:
    app: nl2sql-ui
  ports:
    - port: 8501
      targetPort: 8501
  type: ClusterIP
---
# Requires an ingress controller (e.g. ingress-nginx) installed in the
# cluster. On kind: `kind create cluster --config kind-config.yaml` with
# extraPortMappings, then install ingress-nginx's kind-specific manifest --
# see k8s/README.md.
# Split into two Ingresses because rewrite-target is a per-Ingress annotation:
# /api must strip its prefix before reaching FastAPI, while the UI must not be
# rewritten at all (Streamlit serves /_stcore/* off the root).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nl2sql-api-ingress
  namespace: nl2sql-agentic-rag
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    # A multi-agent query with a correction loop routinely outlives nginx's
    # 60s default, which returns 504 while the pod is still working normally.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /api(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: nl2sql-api
                port:
                  number: 8000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nl2sql-ui-ingress
  namespace: nl2sql-agentic-rag
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nl2sql-ui
                port:
                  number: 8501
