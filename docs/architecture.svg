<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 720" width="900" height="720" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <marker id="arrowCorrect" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b45309"/>
    </marker>
  </defs>

  <rect width="900" height="720" fill="#fbfbfd"/>

  <!-- ===== Interface layer ===== -->
  <rect x="30" y="24" width="840" height="76" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="46" y="46" font-size="11" fill="#64748b" letter-spacing="1.2">INTERFACE</text>

  <rect x="120" y="52" width="150" height="34" rx="5" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="195" y="73" font-size="13" fill="#334155" text-anchor="middle">Streamlit UI</text>

  <rect x="320" y="52" width="150" height="34" rx="5" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="395" y="73" font-size="13" fill="#334155" text-anchor="middle">FastAPI /query</text>

  <rect x="520" y="52" width="190" height="34" rx="5" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="615" y="73" font-size="13" fill="#334155" text-anchor="middle">eval/run_benchmark.py</text>

  <line x1="395" y1="100" x2="395" y2="128" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ===== Pipeline layer ===== -->
  <rect x="30" y="128" width="840" height="416" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="46" y="150" font-size="11" fill="#64748b" letter-spacing="1.2">LANGGRAPH STATE MACHINE — src/graph.py</text>

  <!-- Schema Retriever -->
  <rect x="250" y="166" width="290" height="52" rx="6" fill="#ffffff" stroke="#475569" stroke-width="1.5"/>
  <text x="395" y="187" font-size="14" fill="#0f172a" text-anchor="middle" font-weight="600">Schema Retriever</text>
  <text x="395" y="205" font-size="11" fill="#64748b" text-anchor="middle">top-k tables + types + sample values</text>
  <rect x="566" y="180" width="118" height="24" rx="4" fill="#eef2f7" stroke="#cbd5e1"/>
  <text x="625" y="196" font-size="10.5" fill="#475569" text-anchor="middle">Chroma + MiniLM</text>

  <line x1="395" y1="218" x2="395" y2="248" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Query Planner -->
  <rect x="250" y="248" width="290" height="52" rx="6" fill="#ffffff" stroke="#475569" stroke-width="1.5"/>
  <text x="395" y="269" font-size="14" fill="#0f172a" text-anchor="middle" font-weight="600">Query Planner</text>
  <text x="395" y="287" font-size="11" fill="#64748b" text-anchor="middle">structured plan: tables, joins, filters, aggregation</text>
  <rect x="566" y="262" width="118" height="24" rx="4" fill="#eef2f7" stroke="#cbd5e1"/>
  <text x="625" y="278" font-size="10.5" fill="#475569" text-anchor="middle">OpenAI gpt-5-mini</text>

  <line x1="395" y1="300" x2="395" y2="330" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- SQL Generator -->
  <rect x="250" y="330" width="290" height="52" rx="6" fill="#ffffff" stroke="#475569" stroke-width="1.5"/>
  <text x="395" y="351" font-size="14" fill="#0f172a" text-anchor="middle" font-weight="600">SQL Generator</text>
  <text x="395" y="369" font-size="11" fill="#64748b" text-anchor="middle">plan + schema → SQLite query</text>
  <rect x="566" y="344" width="118" height="24" rx="4" fill="#eef2f7" stroke="#cbd5e1"/>
  <text x="625" y="360" font-size="10.5" fill="#475569" text-anchor="middle">OpenAI gpt-5-mini</text>

  <line x1="395" y1="382" x2="395" y2="412" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Executor -->
  <rect x="250" y="412" width="290" height="52" rx="6" fill="#ffffff" stroke="#475569" stroke-width="1.5"/>
  <text x="395" y="433" font-size="14" fill="#0f172a" text-anchor="middle" font-weight="600">Executor</text>
  <text x="395" y="451" font-size="11" fill="#64748b" text-anchor="middle">runs query, guards against empty SQL</text>
  <rect x="566" y="426" width="118" height="24" rx="4" fill="#eef2f7" stroke="#cbd5e1"/>
  <text x="625" y="442" font-size="10.5" fill="#475569" text-anchor="middle">SQLite</text>

  <!-- success -->
  <line x1="540" y1="438" x2="770" y2="438" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="700" y="430" font-size="11" fill="#475569" text-anchor="middle">success</text>
  <rect x="772" y="424" width="72" height="28" rx="5" fill="#f0fdf4" stroke="#86efac" stroke-width="1.2"/>
  <text x="808" y="443" font-size="12" fill="#166534" text-anchor="middle">result</text>

  <!-- failure down to classifier -->
  <line x1="395" y1="464" x2="395" y2="490" stroke="#b45309" stroke-width="1.5" marker-end="url(#arrowCorrect)"/>
  <text x="440" y="482" font-size="11" fill="#b45309" text-anchor="middle">failure</text>

  <!-- Error Classifier -->
  <rect x="250" y="490" width="290" height="44" rx="6" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
  <text x="395" y="509" font-size="14" fill="#78350f" text-anchor="middle" font-weight="600">Error Classifier</text>
  <text x="395" y="525" font-size="11" fill="#92400e" text-anchor="middle">rule-based first, LLM fallback · Groq llama-3.1-8b</text>

  <!-- ===== Correction routing ===== -->
  <rect x="30" y="562" width="840" height="82" rx="8" fill="#fffbeb" stroke="#fcd34d" stroke-width="1"/>
  <text x="46" y="584" font-size="11" fill="#b45309" letter-spacing="1.2">CORRECTION ROUTING — the diagnosis decides the destination</text>

  <rect x="70" y="596" width="240" height="34" rx="5" fill="#ffffff" stroke="#d97706" stroke-width="1.2"/>
  <text x="190" y="617" font-size="12" fill="#78350f" text-anchor="middle">SCHEMA_ERROR → Retriever</text>

  <rect x="330" y="596" width="240" height="34" rx="5" fill="#ffffff" stroke="#d97706" stroke-width="1.2"/>
  <text x="450" y="617" font-size="12" fill="#78350f" text-anchor="middle">SYNTAX_ERROR → Generator</text>

  <rect x="590" y="596" width="240" height="34" rx="5" fill="#ffffff" stroke="#d97706" stroke-width="1.2"/>
  <text x="710" y="617" font-size="12" fill="#78350f" text-anchor="middle">LOGIC_ERROR → Planner</text>

  <!-- classifier down to routing band -->
  <line x1="395" y1="534" x2="395" y2="558" stroke="#b45309" stroke-width="1.5" marker-end="url(#arrowCorrect)"/>

  <!-- loop back arrow: from routing band left edge up to retriever -->
  <path d="M 60 613 L 40 613 L 40 192 L 246 192" fill="none" stroke="#b45309" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrowCorrect)"/>
  <text x="120" y="380" font-size="11" fill="#b45309" transform="rotate(-90 120 380)" text-anchor="middle">bounded by MAX_RETRIES</text>

  <!-- ===== Deployment layer ===== -->
  <rect x="30" y="660" width="840" height="44" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="46" y="678" font-size="11" fill="#64748b" letter-spacing="1.2">DEPLOYMENT</text>
  <text x="46" y="695" font-size="12" fill="#475569">Docker · docker-compose · Kubernetes manifests · Terraform (AWS Lambda + API Gateway) · GitHub Actions CI</text>
</svg>
